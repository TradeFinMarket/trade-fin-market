<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Loading... | Trafinmarket Blog</title>
<link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#F59E0B">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1C2E;--amber:#F59E0B;--bg:#F8F7F4;--white:#fff;--ink:#1A2332;--muted:#5A6B7A;--border:#DDD9D0;--gr:#059669;--r:#DC2626}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;font-weight:300}
nav{background:var(--navy);border-bottom:2px solid var(--amber);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100}
.nlogo{text-decoration:none;display:flex;flex-direction:column;line-height:1}
.nlogo .nm{font-family:'Playfair Display',serif;font-size:17px;color:#fff;font-weight:700}
.nlogo .ns{font-size:7px;letter-spacing:.4em;text-transform:uppercase;color:var(--amber)}
.nav-r{display:flex;gap:10px}
.nbtn{background:transparent;border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.8);padding:7px 16px;font-size:9px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;border-radius:4px;font-family:'DM Sans',sans-serif;text-decoration:none;transition:all .22s;display:inline-flex;align-items:center}
.nbtn:hover{border-color:var(--amber);color:var(--amber)}
/* HERO */
.post-hero{background:var(--navy);padding:52px 24px;text-align:center}
.post-cat{font-size:9px;letter-spacing:.4em;text-transform:uppercase;color:var(--amber);margin-bottom:14px;font-weight:700}
.post-title{font-family:'Playfair Display',serif;font-size:clamp(28px,4vw,52px);color:#fff;font-weight:700;max-width:800px;margin:0 auto 16px;line-height:1.15}
.post-meta{font-size:11px;color:rgba(255,255,255,.45);letter-spacing:.1em;display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.post-cover{max-height:420px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0F2540,#1A3A5C)}
.post-cover img{width:100%;object-fit:cover}
.post-cover-icon{font-size:80px;padding:48px}
/* CONTENT */
.post-wrap{max-width:740px;margin:0 auto;padding:52px 24px 80px}
.post-body{font-size:15px;line-height:1.9;color:var(--ink)}
.post-body h2{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;margin:36px 0 14px;color:var(--navy)}
.post-body h3{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;margin:28px 0 10px;color:var(--ink)}
.post-body p{margin-bottom:18px}
.post-body ul,.post-body ol{margin:0 0 18px 24px}
.post-body li{margin-bottom:7px;line-height:1.8}
.post-body blockquote{border-left:3px solid var(--amber);padding:12px 18px;background:#FFFBEB;margin:24px 0;font-style:italic;color:var(--muted)}
.post-body strong{font-weight:600;color:var(--ink)}
.post-body a{color:var(--amber);text-decoration:underline}
.post-body img{max-width:100%;border-radius:4px;margin:18px 0}
.post-body hr{border:none;border-top:1px solid var(--border);margin:32px 0}
.post-body code{background:var(--bg);padding:2px 6px;border-radius:3px;font-family:monospace;font-size:13px}
/* CTA BOX */
.cta-box{background:var(--navy);border-radius:6px;padding:32px;text-align:center;margin:40px 0}
.cta-box h3{font-family:'Playfair Display',serif;font-size:22px;color:#fff;margin-bottom:8px}
.cta-box p{font-size:13px;color:rgba(255,255,255,.6);margin-bottom:20px;line-height:1.8}
.cta-btn{display:inline-block;padding:12px 28px;background:var(--amber);color:var(--navy);font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;border-radius:4px;text-decoration:none;transition:all .22s}
.cta-btn:hover{background:#D97706}
/* TAGS */
.post-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:32px}
.tag{padding:4px 10px;background:var(--bg);border:1px solid var(--border);border-radius:2px;font-size:10px;color:var(--muted);letter-spacing:.1em}
/* SHARE */
.share-row{display:flex;align-items:center;gap:10px;padding:20px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin:32px 0}
.share-lbl{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.share-btn{padding:8px 16px;font-size:10px;font-weight:600;letter-spacing:.12em;border:1px solid var(--border);background:var(--white);border-radius:3px;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif}
.share-btn:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
/* RELATED */
.related{padding-top:32px}
.related h3{font-family:'Playfair Display',serif;font-size:20px;margin-bottom:20px}
.rel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.rel-card{background:var(--white);border:1px solid var(--border);border-radius:4px;padding:16px;text-decoration:none;color:inherit;transition:all .22s;display:block}
.rel-card:hover{border-color:var(--amber);background:var(--bg)}
.rel-cat{font-size:8px;letter-spacing:.28em;text-transform:uppercase;color:var(--amber);margin-bottom:6px;font-weight:600}
.rel-title{font-family:'Playfair Display',serif;font-size:15px;font-weight:700;line-height:1.3}
@media(max-width:600px){.post-hero{padding:36px 16px}.post-wrap{padding:32px 14px 60px}.post-title{font-size:26px}}
</style>
</head>
<body>
<nav>
  <a href="/" class="nlogo"><span class="nm">Trafinmarket</span><span class="ns">Premium Trading Education</span></a>
  <div class="nav-r">
    <a href="/blog" class="nbtn">&#8592; Blog</a>
    <a href="/library" class="nbtn">Library</a>
    <a href="/" class="nbtn">Home</a>
  </div>
</nav>

<div id="postContent">
  <div style="text-align:center;padding:80px 20px;color:var(--muted)">Loading article...</div>
</div>

<script>
const CAT_ICONS={share:'📈','share-market':'📈',forex:'💱',crypto:'₿',psychology:'🧠',general:'📝'};
const CAT_LABELS={'share-market':'Share Market',forex:'Forex',crypto:'Crypto',psychology:'Psychology',general:'General'};

window.onload = async () => {
  const slug = window.location.pathname.replace('/blog/','').replace('/','');
  if (!slug) { window.location='/blog'; return; }
  try {
    const r = await fetch('/api/blog/' + slug);
    if (!r.ok) { document.getElementById('postContent').innerHTML='<div style="text-align:center;padding:80px;color:var(--r)">Article not found. <a href="/blog" style="color:var(--amber)">Back to Blog</a></div>'; return; }
    const { post } = await r.json();

    // Update page meta dynamically
    document.title = (post.metaTitle || post.title) + ' | Trafinmarket Blog';
    document.querySelector('meta[name="viewport"]').insertAdjacentHTML('afterend',
      `<meta name="description" content="${post.metaDesc||post.excerpt}">
       <meta property="og:title" content="${post.title}">
       <meta property="og:description" content="${post.excerpt}">
       <link rel="canonical" href="https://trafinmarket.in/blog/${post.slug}">`
    );

    const coverHTML = post.coverImage
      ? `<div class="post-cover"><img src="${post.coverImage}" alt="${post.title}"></div>`
      : `<div class="post-cover"><div class="post-cover-icon">${CAT_ICONS[post.category]||'📝'}</div></div>`;

    const tagsHTML = post.tags?.length
      ? `<div class="post-tags">${post.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>` : '';

    document.getElementById('postContent').innerHTML = `
      <div class="post-hero">
        <div class="post-cat">${CAT_LABELS[post.category]||post.category}</div>
        <h1 class="post-title">${post.title}</h1>
        <div class="post-meta">
          <span>By ${post.author}</span>
          <span>${new Date(post.publishedAt).toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})}</span>
          <span>${post.readTime} min read</span>
          <span>${post.views} views</span>
        </div>
      </div>
      ${coverHTML}
      <div class="post-wrap">
        ${tagsHTML}
        <div class="post-body">${post.content}</div>
        <div class="share-row">
          <span class="share-lbl">Share:</span>
          <button class="share-btn" onclick="sharePost('twitter')">Twitter / X</button>
          <button class="share-btn" onclick="sharePost('whatsapp')">WhatsApp</button>
          <button class="share-btn" onclick="sharePost('copy')">Copy Link</button>
        </div>
        <div class="cta-box">
          <h3>Learn More About Trading</h3>
          <p>Browse our premium PDF guides written with brutal honesty for Indian traders. No shortcuts, no promises — just knowledge that works.</p>
          <a href="/library" class="cta-btn">Browse PDF Library &rarr;</a>
        </div>
      </div>`;
  } catch(e) {
    document.getElementById('postContent').innerHTML='<div style="text-align:center;padding:80px;color:var(--r)">Failed to load article. <a href="/blog" style="color:var(--amber)">Back to Blog</a></div>';
  }
};

function sharePost(platform) {
  const url = window.location.href;
  const title = document.querySelector('.post-title')?.textContent || 'Trafinmarket Blog';
  if (platform==='twitter') window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(title)}&url=${encodeURIComponent(url)}`,'_blank');
  else if (platform==='whatsapp') window.open(`https://wa.me/?text=${encodeURIComponent(title+' '+url)}`,'_blank');
  else { navigator.clipboard.writeText(url).then(()=>alert('Link copied!')).catch(()=>{}); }
}
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{});});}
</script>
</body>
</html>
